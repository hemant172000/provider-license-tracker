spring.application.name=provider-license-tracker

# PostgreSQL connection (local demo defaults; override with environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/license_tracker}
spring.datasource.username=${DB_USERNAME:admin1}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT configuration (demo default; set JWT_SECRET for any real deployment)
jwt.secret=${JWT_SECRET:demo-only-jwt-secret-change-before-deploying-0123456789}
jwt.expiration=3600000

# Activity tracking settings
activity.idle.threshold=60
activity.away.threshold=900
activity.break.threshold=1800

# Active profile
spring.profiles.active=dev